
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP tidak ditemukan!"
            exit 1
          fi

          unzip -o -q "$ZIP"

          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")

          if [ ! -f "$DIR/app/build.gradle" ]; then
            echo "ERROR: Folder project Android tidak valid!"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GameTurbo-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
